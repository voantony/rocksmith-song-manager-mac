name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: ./eng/test.sh

      - name: Package Apple silicon
        run: ./packaging/assemble-macos-app.sh osx-arm64

      - name: Package Intel
        run: ./packaging/assemble-macos-app.sh osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: MacSongManager-apps
          path: artifacts/*/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shasum -a 256 artifacts/*/*.zip > artifacts/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --title "Mac Song Manager $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            artifacts/*/*.zip \
            artifacts/SHA256SUMS.txt
